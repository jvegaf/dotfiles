config_version = 14

[accessibility]
ui_scale = 1.1000000089406967

[bar.default]
center = [ "status", "workspaces", "caffeine" ]
end = [ "media", "spacer_1", "tray", "notifications", "network", "volume", "battery", "clock", "session" ]
scale = 1.1500000096857548
start = [ "launcher", "toggle", "spacer_1", "group:g1" ]
thickness = 24

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = ""
    enabled = true
    fill = "on_secondary"
    id = "g1"
    members = [ "temp", "sysmon_2", "sysmon_3", "cpu" ]
    opacity = 1.0
    padding = 6.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.00006103515625
    cy = 861.60003662109375
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "maddingo/hypr-layout-switcher", "goodroot/noctwhspr" ]

[theme]
community_palette = "One"
source = "community"

    [theme.templates]
    builtin_ids = [ "kitty" ]

[wallpaper]
directory = "/home/th3g3ntl3man/.backgrounds"

    [wallpaper.default]
    path = "/home/th3g3ntl3man/.backgrounds/bg_03.jpg"

    [wallpaper.last]
    path = "/home/th3g3ntl3man/.backgrounds/bg_03.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/th3g3ntl3man/.backgrounds/bg_03.jpg"

[widget.battery]
scale = 1.6000000000000001
show_label = false

[widget.clock]
color = "secondary"
font_family = "FontAwesome"
format = "{:%H:%M}"
scale = 1.2000000000000002

[widget.media]
hide_album_art = true
hide_artist = true
hide_when_no_media = true
max_length = 74
show_progress = true
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.status]
type = "goodroot/noctwhspr:status"

[widget.sysmon_3]
show_value = false

[widget.toggle]
font_family = "archcraft"
font_scale = 0.84999999999999998
type = "maddingo/hypr-layout-switcher:toggle"

[widget.volume]
show_label = false

[widget.workspaces]
pill_scale = 0.65000000000000002
show_labels = false