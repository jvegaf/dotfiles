[mgr]
ratio = [1, 4, 3]
sort_by = "natural"
sort_dir_first = true
show_hidden = true

[opener]
folder = [
  { run = 'hyprctl dispatch exec "[float; size 60% 60%; center 1] nemo %s1"', orphan = true, desc = "nemo", for = "linux" },
  { run = 'kitty --detach nvim %s', orphan = true, desc = "neovim (detached)", for = "linux" },
  { run = 'kitty --detach lazygit -p %s1', orphan = true, desc = "lazygit", for = "linux" },
  { run = 'codium %s', orphan = true, desc = "vscodium", for = "linux" },
  { run = 'kitty %s', orphan = true, desc = "kitty", for = "linux" },
  { run = 'xdg-open %s', orphan = true, desc = "xdg-open", for = "linux" },
]

text = [
  { run = '${EDITOR:-nvim} %s', block = true, desc = "$EDITOR", for = "linux" },
  { run = 'nvim %s', block = true, desc = "neovim", for = "linux" },
  { run = 'kitty --detach nvim %s', orphan = true, desc = "neovim (detached)", for = "linux" },
  { run = 'codium %s', orphan = true, desc = "vscodium", for = "linux" },
  { run = 'xdg-open %s', orphan = true, desc = "xdg-open", for = "linux" },
]

document = [
  { run = 'xdg-open %s', orphan = true, desc = "xdg-open", for = "linux" },
  { run = 'zathura %s', orphan = true, desc = "zathura", for = "linux" },
  { run = 'libreoffice %s', orphan = true, desc = "libreoffice", for = "linux" },
]

image = [
  { run = 'xdg-open %s', orphan = true, desc = "xdg-open", for = "linux" },
  { run = 'qimgv %s', orphan = true, desc = "qimgv", for = "linux" },
  { run = 'krita %s', orphan = true, desc = "krita", for = "linux" },
  { run = 'satty --filename %s1', orphan = true, desc = "satty", for = "linux" },
]

video = [
  { run = 'xdg-open %s', orphan = true, desc = "xdg-open", for = "linux" },
  { run = 'mpv %s', orphan = true, desc = "mpv", for = "linux" },
  { run = 'vlc %s', orphan = true, desc = "vlc", for = "linux" },
]

audio = [
  { run = 'xdg-open %s', orphan = true, desc = "xdg-open", for = "linux" },
  { run = 'mpv %s', orphan = true, desc = "mpv", for = "linux" },
  { run = 'vlc %s', orphan = true, desc = "vlc", for = "linux" },
]

extract = [
  { run = 'ouch d -y %s', desc = "Extract here with ouch", for = "unix" },
]

fallback = [
  { run = 'xdg-open %s', orphan = true, desc = "xdg-open", for = "linux" },
]

[open]
rules = [
  { url = "*/", use = "folder" },

  { mime = "text/*", use = "text" },
  { mime = "image/*", use = "image" },
  { mime = "video/*", use = "video" },
  { mime = "application/octet-stream", use = "video" },
  { mime = "audio/*", use = "audio" },
  { mime = "inode/x-empty", use = "text" },
  { mime = "application/json", use = "text" },

  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [
    "archive",
    "extract",
    "reveal",
  ] },
  { mime = "application/pdf", use = "document" },
  { mime = "application/epub+zip", use = "document" },
  { mime = "application/x-mobipocket-ebook", use = "document" },

  { mime = "*", use = "fallback" },
]

[plugin]
prepend_fetchers = [
  { url = "*", run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
]

prepend_previewers = [
  { url = "*.{3mf,obj,pts,ply,stl,step,stp}", run = "f3d-preview" },
  { mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", run = "ouch --archive-icon=' ' --show-file-icons" },
]
